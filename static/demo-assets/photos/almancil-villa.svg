<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="55%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- abstract golf greens / palm fronds -->
  <ellipse cx="160" cy="500" rx="220" ry="120" fill="#4d7c0f" opacity="0.55"/>
  <ellipse cx="600" cy="540" rx="280" ry="100" fill="#4d7c0f" opacity="0.55"/>
  <!-- palm fronds -->
  <g transform="translate(140,300)" fill="#365314" opacity="0.7">
    <rect x="-3" y="0" width="6" height="200"/>
    <ellipse cx="-30" cy="0" rx="30" ry="8" transform="rotate(-30,-30,0)"/>
    <ellipse cx="30" cy="0" rx="30" ry="8" transform="rotate(30,30,0)"/>
    <ellipse cx="-25" cy="-20" rx="28" ry="7" transform="rotate(-60,-25,-20)"/>
    <ellipse cx="25" cy="-20" rx="28" ry="7" transform="rotate(60,25,-20)"/>
  </g>
  <!-- large villa with multiple wings -->
  <g transform="translate(420,140)" fill="#fef3c7" opacity="0.94">
    <rect x="0" y="80" width="280" height="160" rx="4"/>
    <polygon points="0,80 140,20 280,80"/>
    <rect x="120" y="160" width="40" height="80" fill="#365314"/>
    <rect x="20" y="110" width="35" height="35" fill="#365314"/>
    <rect x="70" y="110" width="35" height="35" fill="#365314"/>
    <rect x="175" y="110" width="35" height="35" fill="#365314"/>
    <rect x="225" y="110" width="35" height="35" fill="#365314"/>
  </g>
  <!-- pool -->
  <ellipse cx="560" cy="430" rx="130" ry="18" fill="#22d3ee" opacity="0.85"/>
  <!-- text -->
  <text x="60" y="280" font-size="58" font-weight="700" fill="#fff" letter-spacing="-1">ALMANCIL</text>
  <text x="60" y="340" font-size="32" font-weight="500" fill="#ecfccb">Villa V4 · Quinta do Lago · golf</text>
  <text x="60" y="520" font-size="42" font-weight="600" fill="#fef3c7">750.000 EUR · 220 m²</text>
  <text x="60" y="555" font-size="20" fill="#bef264" font-family="ui-monospace,'SF Mono',monospace">demo-almancil-villa · immoscout24</text>
</svg>
