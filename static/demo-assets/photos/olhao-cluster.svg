<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- terracotta rooftops scape (Olhão alfama-style) -->
  <g fill="#7c2d12" opacity="0.55">
    <rect x="0" y="430" width="170" height="170"/>
    <rect x="170" y="410" width="190" height="190"/>
    <rect x="360" y="445" width="160" height="155"/>
    <rect x="520" y="420" width="180" height="180"/>
    <rect x="700" y="450" width="100" height="150"/>
  </g>
  <g fill="#92400e" opacity="0.85">
    <polygon points="0,430 85,400 170,430"/>
    <polygon points="170,410 265,375 360,410"/>
    <polygon points="360,445 440,415 520,445"/>
    <polygon points="520,420 610,385 700,420"/>
    <polygon points="700,450 750,425 800,450"/>
  </g>
  <!-- terrace silhouette with sea view -->
  <g transform="translate(550,160)" fill="#fef3c7" opacity="0.92">
    <rect x="0" y="80" width="180" height="120" rx="4"/>
    <polygon points="0,80 90,30 180,80"/>
    <rect x="70" y="130" width="40" height="70" fill="#7c2d12"/>
    <rect x="20" y="100" width="35" height="25" fill="#7c2d12"/>
    <rect x="125" y="100" width="35" height="25" fill="#7c2d12"/>
  </g>
  <!-- cluster badge -->
  <g transform="translate(60,180)">
    <rect width="220" height="40" rx="20" fill="#fff" opacity="0.95"/>
    <circle cx="22" cy="20" r="6" fill="#0ea5e9"/>
    <circle cx="42" cy="20" r="6" fill="#9333ea"/>
    <text x="60" y="26" font-size="16" font-weight="600" fill="#1f2937" font-family="ui-monospace,'SF Mono',monospace">2 portals · same address</text>
  </g>
  <!-- text -->
  <text x="60" y="290" font-size="58" font-weight="700" fill="#fff" letter-spacing="-1">OLHÃO</text>
  <text x="60" y="350" font-size="34" font-weight="500" fill="#fef3c7">T2 renovada · centro histórico</text>
  <text x="60" y="520" font-size="42" font-weight="600" fill="#fef3c7">280.000 EUR · 65 m²</text>
  <text x="60" y="555" font-size="20" fill="#fde68a" font-family="ui-monospace,'SF Mono',monospace">demo-olhao-cluster · homegate + idealista</text>
</svg>
