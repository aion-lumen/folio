  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- desaturated golf+sea horizon -->
  <rect x="0" y="400" width="800" height="200" fill="#1e293b" opacity="0.5"/>
  <path d="M0 400 Q 200 380 400 395 T 800 390 L800 600 L0 600 Z" fill="#0f172a" opacity="0.55"/>
  <!-- modern apartment block -->
  <g transform="translate(540,170)" fill="#cbd5e1" opacity="0.85">
    <rect x="0" y="40" width="160" height="160" rx="4"/>
    <rect x="-10" y="180" width="180" height="22"/>
    <rect x="20" y="60" width="30" height="30" fill="#0f172a"/>
    <rect x="65" y="60" width="30" height="30" fill="#0f172a"/>
    <rect x="110" y="60" width="30" height="30" fill="#0f172a"/>
    <rect x="20" y="105" width="30" height="30" fill="#0f172a"/>
    <rect x="65" y="105" width="30" height="30" fill="#0f172a"/>
    <rect x="110" y="105" width="30" height="30" fill="#0f172a"/>
  </g>
