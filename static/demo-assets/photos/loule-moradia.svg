<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- abstract rolling hills -->
  <path d="M0 420 Q 200 380 400 410 T 800 400 L800 600 L0 600 Z" fill="#7c2d12" opacity="0.45"/>
  <path d="M0 460 Q 240 430 480 450 T 800 440 L800 600 L0 600 Z" fill="#7c2d12" opacity="0.6"/>
  <!-- villa silhouette with pool -->
  <g transform="translate(510,160)" fill="#fef3c7" opacity="0.95">
    <rect x="0" y="60" width="200" height="130" rx="4"/>
    <polygon points="0,60 100,10 200,60"/>
    <rect x="80" y="120" width="40" height="70" fill="#7c2d12"/>
    <rect x="20" y="85" width="40" height="30" fill="#7c2d12"/>
    <rect x="140" y="85" width="40" height="30" fill="#7c2d12"/>
  </g>
  <ellipse cx="610" cy="395" rx="100" ry="14" fill="#22d3ee" opacity="0.85"/>
  <!-- text -->
  <text x="60" y="280" font-size="58" font-weight="700" fill="#fff" letter-spacing="-1">LOULÉ</text>
  <text x="60" y="340" font-size="34" font-weight="500" fill="#fff7ed">Moradia T4 · Cerro · piscina</text>
  <text x="60" y="520" font-size="42" font-weight="600" fill="#fef3c7">520.000 EUR · 142 m²</text>
  <text x="60" y="555" font-size="20" fill="#fed7aa" font-family="ui-monospace,'SF Mono',monospace">demo-loule-moradia · homegate</text>
</svg>
